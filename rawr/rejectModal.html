<!-- Reject Modal (inserted via index.html patch) -->
<div class="modal" id="rejectModal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h2 class="modal-title">Reject Transit</h2>
            <button class="modal-close" onclick="closeModal('rejectModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding: 16px;">
            <p>Select reason(s) for rejecting:</p>
            <div><label><input type="checkbox" class="reject-reason" value="Busy"> Busy</label></div>
            <div><label><input type="checkbox" class="reject-reason" value="Vehicle issue"> Vehicle issue</label></div>
            <div><label><input type="checkbox" class="reject-reason" value="Personal emergency"> Personal emergency</label></div>
            <div><label><input type="checkbox" id="rejectReasonOtherChk" class="reject-reason" value="Other"> Other</label></div>
            <div id="rejectOtherInput" style="display:none; margin-top:8px;"><input type="text" id="rejectOtherText" class="form-input" placeholder="Please specify"></div>
        </div>
        <div style="display:flex; gap:12px; padding: 16px;">
            <button class="btn btn-secondary" onclick="closeModal('rejectModal')">Cancel</button>
            <button class="btn btn-danger" onclick="submitReject()">Reject Transit</button>
        </div>
    </div>
</div>
